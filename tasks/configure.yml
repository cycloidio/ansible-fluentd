---
- name: Create Fluent Bit configuration directory
  file:
    path: /etc/fluent-bit
    state: directory
    mode: "0755"

- name: Create Fluent Bit state/log directory (for tail DB files)
  file:
    path: /var/log/fluent-bit
    state: directory
    mode: "0755"

- name: Create Fluent Bit main configuration file
  template:
    src: fluent-bit.conf.j2
    dest: /etc/fluent-bit/fluent-bit.conf
    mode: "0644"
  notify: restart fluent-bit
