---
- name: Install dependencies
  package:
    name: "{{ fluentd_dependencies }}"
    state: present

- block:
    # how to get the key
    # https://fluentd.cdn.cncf.io/sh/install-debian-bookworm-fluent-package6.sh
    # curl -o fluent-apt-source.deb https://fluentd.cdn.cncf.io/6/debian/bookworm/pool/contrib/f/fluent-apt-source/fluent-apt-source_2025.8.29-1_all.deb
    # dpkg-deb -x fluent-apt-source.deb ./extract_dir
    # - name: Download Fluentd GPG key
    #   ansible.builtin.get_url:
    #     url: https://fluentd.cdn.cncf.io/fluent-package.key
    #     dest: /usr/share/keyrings/fluent-package.gpg
    #     mode: '0644'

    # - name: Add Fluentd APT repository
    #   ansible.builtin.apt_repository:
    #     repo: "deb [signed-by=/usr/share/keyrings/fluent-package.gpg] {{ fluentd_apt_repository }} {{ ansible_distribution_release|lower }} contrib"
    #     state: present
    #     filename: fluentd
    #     update_cache: true

    - name: Download Fluentd install script
      ansible.builtin.get_url:
        url: https://fluentd.cdn.cncf.io/sh/install-{{ ansible_distribution|lower }}-{{ ansible_distribution_release|lower }}-fluent-package{{ fluentd_tdagent_version }}-lts.sh
        dest: /tmp/install-fluentd.sh
        mode: "0755"

    - name: Run Fluentd install script
      ansible.builtin.shell: /tmp/install-fluentd.sh
      args:
        creates: /opt/fluent/bin/fluentd

- name: Install fluentd (td-agent) and plugins dependencies
  package:
    name: "{{ item }}"
    state: present
  with_items:
    - td-agent
    - "{{ fluentd_plugins_dependencies }}"
  notify: restart td-agent

- name: Check if systemd exists
  stat: path="/lib/systemd/system/{{ fluentd_service }}.service"
  register: tdagent_service

- name: Check if default fluentd exists
  stat: path="/etc/default/{{ fluentd_service }}"
  register: tdagent_default

- name: (systemd) Change the user who run td-agent
  lineinfile:
    dest: "/lib/systemd/system/{{ fluentd_service }}.service"
    backrefs: yes
    state: present
    regexp: "^User=_fluentd"
    line: "User={{ fluentd_user }}"
  when: tdagent_service.stat.exists and ansible_service_mgr == 'systemd'

- name: (systemd) Force a daemon reload
  systemd: daemon_reload=yes
  when: tdagent_service.stat.exists and ansible_service_mgr == 'systemd'
  notify: restart td-agent
